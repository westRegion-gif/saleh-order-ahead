<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saleh Branch Orders</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="ops"><aside class="sidebar"><div class="sidebrand">SALEH.</div><div class="nav"><a class="active">Live Orders</a>{% if user.role in ["admin","manager"] %}<a href="/admin">Management</a>{% endif %}<a href="/">Customer</a><button onclick="logout()">Logout</button></div></aside><main class="main">
<div class="section-head"><div><span class="muted">Branch Order Screen · {{ user.username }}</span><h2>{{ branch.name }}</h2><div><span id="livePill" class="pill ok">● LIVE</span> <span id="branchMode" class="pill"></span></div></div><div class="branch-tools"><button id="pauseBtn" class="btn"></button><button class="btn" onclick="toggleAutoPrint()" id="autoPrintBtn">Auto Print: Off</button><button class="btn" onclick="loadOrders()">Refresh</button></div></div>
<div class="admin-tabs"><button class="active" onclick="setStation('all',this)">All</button><button onclick="setStation('bar',this)">Bar</button><button id="kitchenTab" onclick="setStation('kitchen',this)">Kitchen</button><button onclick="setStation('history',this)">Completed</button></div>
<div class="filter-row"><div class="search"><input id="searchOrders" placeholder="Search order or customer" oninput="renderBoard()"></div><div class="muted" id="queueMeta"></div></div>
<div id="board" class="order-board"><div class="column"><h3>New</h3><div id="new"></div></div><div class="column"><h3>Preparing</h3><div id="preparing"></div></div><div class="column"><h3>Ready</h3><div id="ready"></div></div></div>
<div id="history" class="card hidden"><h3>Completed Today</h3><div id="historyList" class="history-list"></div></div>
</main></div>
<script>
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}
const BID={{ branch.id }};let orders=[],branch=null,station='all',autoPrint=localStorage.getItem('saleh_auto_print')==='1';const $=id=>document.getElementById(id);
async function loadMeta(){branch=(await fetch('/api/branches').then(r=>r.json())).find(b=>b.id===BID);$('branchMode').textContent=`${branch.has_kitchen?'Bar + Kitchen':'Bar only'} · ~${branch.eta_minutes} min`;$('kitchenTab').classList.toggle('hidden',!branch.has_kitchen);$('pauseBtn').textContent=branch.paused?'Resume Orders':'Pause Orders';$('pauseBtn').className='btn '+(branch.paused?'sand':'bad')}
async function loadOrders(){orders=await fetch(`/api/orders?branch_id=${BID}&limit=250`).then(r=>r.json());renderBoard();loadMeta()}
function setStation(s,btn){station=s;document.querySelectorAll('.admin-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderBoard()}
function minutesAgo(ts){return Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/60000))}
function orderMatches(o){let q=$('searchOrders').value.toLowerCase();if(q&&!(`${o.order_no} ${o.customer_name} ${o.mobile||''}`).toLowerCase().includes(q))return false;if(station==='bar'||station==='kitchen')return o.items.some(i=>i.station===station);return true}
function renderBoard(){['new','preparing','ready'].forEach(s=>$(s).innerHTML='');$('historyList').innerHTML='';let live=orders.filter(o=>['new','preparing','ready'].includes(o.status)&&orderMatches(o));$('queueMeta').textContent=`${live.length} live order${live.length===1?'':'s'}`;$('board').classList.toggle('hidden',station==='history');$('history').classList.toggle('hidden',station!=='history');if(station==='history'){orders.filter(o=>o.status==='completed'&&o.created_at.slice(0,10)===new Date().toISOString().slice(0,10)).forEach(o=>$('historyList').insertAdjacentHTML('beforeend',historyHtml(o)));return}live.reverse().forEach(o=>$(o.status).prepend(orderEl(o)))}
function orderEl(o){let el=document.createElement('div');el.className='order '+(o.status==='new'?'new':'');let mins=minutesAgo(o.created_at),late=branch&&mins>(branch.base_prep_minutes+5);let groups={};o.items.forEach(i=>(groups[i.station]??=[]).push(i));let stationHtml=Object.entries(groups).map(([s,items])=>{let done=items.every(i=>i.station_status==='done');let visible=station==='all'||station===s;return visible?`<div class="station-box ${done?'done':''}"><div class="station-title"><span>${s==='bar'?'☕ Bar':'🍽 Kitchen'}</span><span>${done?'Done ✓':'Pending'}</span></div>${items.map(i=>`<div>${i.qty} × ${i.product_name}<br><small class="muted">${i.size}${i.milk&&i.milk!=='N/A'?' · '+i.milk:''}</small></div>`).join('')}${o.status==='preparing'&&!done?`<button class="btn dark" style="margin-top:8px;width:100%" onclick="stationDone(${o.id},'${s}')">Mark ${s} done</button>`:''}</div>`:''}).join('');let actions=o.status==='new'?`<button class="print" onclick="printOrder(${o.id})">Print</button><button class="accept" onclick="setStatus(${o.id},'preparing')">Accept</button>`:o.status==='ready'?`<button class="print" onclick="printOrder(${o.id})">Reprint</button><button class="accept" onclick="setStatus(${o.id},'completed')">Collected</button>`:`<button class="print" onclick="printOrder(${o.id})">Reprint</button>`;el.innerHTML=`<div class="orderhead"><div><b style="font-size:18px">#${o.order_no}</b><br><small class="muted">${o.customer_name} · ${o.pickup_type} · ${o.pickup_time}</small></div><div style="text-align:right"><b>${Number(o.total).toFixed(2)} AED</b><div class="order-timer ${late?'late':''}">${mins} min</div></div></div>${o.customer_note?`<div class="pill warn" style="margin-top:7px">Note: ${o.customer_note}</div>`:''}${stationHtml}<div class="actions">${actions}</div>`;return el}
function historyHtml(o){return `<div class="cart-item"><div><b>#${o.order_no}</b><br><small class="muted">${o.customer_name} · ${o.pickup_type}</small></div><div><b>${Number(o.total).toFixed(2)} AED</b><br><button class="btn" onclick="printOrder(${o.id})">Receipt</button></div></div>`}
async function setStatus(id,status){await fetch(`/api/orders/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadOrders()}
async function stationDone(id,s){await fetch(`/api/orders/${id}/station/${s}/done`,{method:'PATCH'});loadOrders()}
function printOrder(id){let w=window.open(`/receipt/${id}`,'receipt','width=430,height=700');setTimeout(()=>{try{w.print()}catch(e){}},650)}
function beep(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=900;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},450)}catch(e){}}
function toggleAutoPrint(){autoPrint=!autoPrint;localStorage.setItem('saleh_auto_print',autoPrint?'1':'0');$('autoPrintBtn').textContent='Auto Print: '+(autoPrint?'On':'Off')}
async function togglePause(){await fetch(`/api/branches/${BID}/settings`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused:!branch.paused})});loadMeta()}
$('pauseBtn').onclick=togglePause;$('autoPrintBtn').textContent='Auto Print: '+(autoPrint?'On':'Off');
let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='order_created'&&m.order.branch_id===BID){beep();if(autoPrint)printOrder(m.order.id);loadOrders()}else if((m.type==='order_updated'&&m.order.branch_id===BID)||m.type==='branch_settings_updated')loadOrders()};ws.onopen=()=>ws.send('branch connected');setInterval(renderBoard,30000);loadOrders();
</script></body></html>
