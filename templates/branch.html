<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saleh Branch Orders</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="ops"><aside class="sidebar"><div class="sidebrand">SALEH.</div><div class="nav"><a class="active">Live Orders</a><a href="/admin">Management</a><a href="/">Customer</a></div></aside><main class="main"><div class="section-head"><div><span class="muted">Branch Order Screen</span><h2>{{ branch.name }}</h2></div><div><span class="pill">● LIVE</span> <button class="btn" onclick="loadOrders()">Refresh</button></div></div><div id="board" class="order-board"><div class="column"><h3>New</h3><div id="new"></div></div><div class="column"><h3>Preparing</h3><div id="preparing"></div></div><div class="column"><h3>Ready</h3><div id="ready"></div></div></div></main></div><script>
const BID={{ branch.id }}; let known=new Set();
async function loadOrders(){let orders=await fetch(`/api/orders?branch_id=${BID}&limit=100`).then(r=>r.json());['new','preparing','ready'].forEach(s=>document.getElementById(s).innerHTML='');orders.filter(o=>['new','preparing','ready'].includes(o.status)).reverse().forEach(renderOrder);known=new Set(orders.map(o=>o.id))}
function renderOrder(o){let el=document.createElement('div');el.className='order '+(o.status==='new'?'new':'');el.id='order-'+o.id;let items=o.items.map(i=>`${i.qty} × ${i.product_name}<br><small class="muted">${i.size} · ${i.milk}</small>`).join('<br>');let actions=o.status==='new'?`<button class="print" onclick="printOrder(${o.id})">Print</button><button class="accept" onclick="setStatus(${o.id},'preparing')">Accept</button>`:o.status==='preparing'?`<button class="print" onclick="printOrder(${o.id})">Reprint</button><button class="ready" onclick="setStatus(${o.id},'ready')">Mark Ready</button>`:`<button class="accept" onclick="setStatus(${o.id},'completed')">Collected</button>`;el.innerHTML=`<div class="orderhead"><div><b style="font-size:18px">#${o.order_no}</b><br><small class="muted">${o.pickup_time}</small></div><b>${Number(o.total).toFixed(2)} AED</b></div><div style="margin:11px 0">${items}</div><div class="actions">${actions}</div>`;document.getElementById(o.status).prepend(el)}
async function setStatus(id,status){await fetch(`/api/orders/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadOrders()}
function printOrder(id){let w=window.open(`/receipt/${id}`,'receipt','width=430,height=700');setTimeout(()=>{try{w.print()}catch(e){}},600)}
function beep(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=900;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},450)}catch(e){}}
let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='order_created'&&m.order.branch_id===BID){beep();loadOrders()}else if(m.type==='order_updated'&&m.order.branch_id===BID)loadOrders()};ws.onopen=()=>ws.send('branch connected');
loadOrders();
</script></body></html>
