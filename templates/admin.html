<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saleh Management</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="ops"><aside class="sidebar"><div class="sidebrand">SALEH.</div><div class="nav"><a class="active">Management</a><a href="/branch/1">Branch Screen</a><a href="/">Customer</a></div></aside><main class="main"><div class="section-head"><div><span class="muted">All branches</span><h2>Management Dashboard</h2></div><button class="btn" onclick="refreshAll()">Refresh</button></div><div class="metric-grid"><div class="card metric"><div class="label">Sales Today</div><div class="value" id="sales">0</div></div><div class="card metric"><div class="label">Orders</div><div class="value" id="orders">0</div></div><div class="card metric"><div class="label">Avg Order</div><div class="value" id="avg">0</div></div><div class="card metric"><div class="label">Low Stock</div><div class="value" id="low">0</div></div></div><div class="split"><div class="card"><h3>Branches</h3><table class="table"><thead><tr><th>Branch</th><th>Sales</th><th>Orders</th><th>Live screen</th></tr></thead><tbody id="branches"></tbody></table></div><div class="card"><h3>Top Products</h3><table class="table"><thead><tr><th>Product</th><th>Qty</th><th>Sales</th></tr></thead><tbody id="products"></tbody></table></div></div><div class="card" style="margin-top:12px"><h3>Inventory — All Branches</h3><table class="table"><thead><tr><th>Branch</th><th>Item</th><th>On Hand</th><th>Minimum</th><th>Status</th></tr></thead><tbody id="inv"></tbody></table></div></main></div><script>
async function refreshAll(){let d=await fetch('/api/dashboard').then(r=>r.json());sales.textContent=Number(d.sales).toFixed(2)+' AED';orders.textContent=d.orders;avg.textContent=Number(d.avg_order).toFixed(2)+' AED';low.textContent=d.low_stock;branches.innerHTML=d.branches.map(b=>`<tr><td><b>${b.name}</b></td><td>${Number(b.sales).toFixed(2)} AED</td><td>${b.orders}</td><td><a href="/branch/${b.id}">Open</a></td></tr>`).join('');products.innerHTML=d.top_products.map(p=>`<tr><td>${p.product_name}</td><td>${p.qty}</td><td>${Number(p.sales).toFixed(2)} AED</td></tr>`).join('');let i=await fetch('/api/inventory').then(r=>r.json());inv.innerHTML=i.map(x=>`<tr><td>${x.branch_name}</td><td>${x.item_name}</td><td>${Number(x.on_hand).toFixed(2)} ${x.unit}</td><td>${x.minimum} ${x.unit}</td><td><span class="pill" style="background:${x.on_hand<x.minimum?'#f8dedd':'#dceee4'}">${x.on_hand<x.minimum?'Low':'Healthy'}</span></td></tr>`).join('')}
let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=()=>refreshAll();ws.onopen=()=>ws.send('admin connected');refreshAll();
</script></body></html>
