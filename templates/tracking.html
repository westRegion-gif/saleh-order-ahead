<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Order</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}.track-wrap{max-width:720px;margin:auto;padding:26px 16px}.track-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.track-brand{font-size:22px;font-weight:950;letter-spacing:-1px}.track-brand small{display:block;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}.track-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.order-no{font-size:42px;font-weight:950;letter-spacing:-1.5px;margin:5px 0}.status-label{font-size:30px;font-weight:950;letter-spacing:-1px;margin:10px 0 4px}.status-copy{font-size:15px;line-height:1.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:24px 0 10px}.step{height:6px;background:#ddd;border-radius:999px}.step.on{background:#111}.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:22px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.summary .box{border:1px solid var(--line);border-radius:15px;padding:13px}.summary small{display:block;color:var(--muted);margin-bottom:4px}.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.station{font-size:11px;padding:5px 8px;border-radius:999px;background:#f2f2ee;white-space:nowrap}.station.ok{background:#111;color:#fff}.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#111;box-shadow:0 0 0 4px #1111}.actions{display:flex;gap:8px;margin-top:20px}.actions .btn{flex:1;text-align:center;text-decoration:none}.cancelled{border-color:#111}.credit-note{display:none;margin-top:14px;padding:13px;border:1px solid #111;border-radius:14px;background:#f7f7f4}.cancelled .credit-note{display:block}@media(max-width:560px){.track-wrap{padding:14px 12px}.track-card{padding:19px;border-radius:20px}.order-no{font-size:36px}.status-label{font-size:27px}.summary{grid-template-columns:1fr}.labels{font-size:9px}.actions{flex-direction:column}}
</style>
</head>
<body><main class="track-wrap"><div class="track-head"><div class="track-brand">SALEH.<small>Order Tracking</small></div><span class="live"><i class="dot"></i>Live</span></div><section class="track-card" id="card"><div class="kicker">Your order</div><div id="no" class="order-no"></div><div id="branch" class="muted"></div><div id="steps" class="steps"><i class="step"></i><i class="step"></i><i class="step"></i><i class="step"></i></div><div class="labels"><span>Confirmed</span><span>Preparing</span><span>Ready</span><span>Collected</span></div><div id="status" class="status-label"></div><p id="details" class="muted status-copy"></p><div class="credit-note"><b>Order not accepted by branch</b><div class="muted" style="margin-top:5px">When Wallet is connected, rejected paid orders will be credited to your in-app balance automatically.</div></div><div class="summary"><div class="box"><small>Pickup</small><b id="pickup">—</b></div><div class="box"><small>Branch</small><b id="branchBox">—</b></div></div><div class="option-title">Order items</div><div id="items"></div><div class="actions"><a class="btn dark" href="/">Back to menu</a><button class="btn" onclick="load()">Refresh status</button></div></section></main>
<script>
const ORDER={{ order_no|tojson }};const $=id=>document.getElementById(id);function paintSteps(status){let n={new:1,preparing:2,ready:3,completed:4}[status]||1;document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('on',i<n))}
async function load(){let r=await fetch('/api/order/'+ORDER,{cache:'no-store'});if(!r.ok)return;let o=await r.json();$('no').textContent='#'+ORDER;$('branch').textContent=o.branch_name+' · '+o.pickup_type+' · '+o.pickup_time;$('pickup').textContent=o.pickup_type+' · '+o.pickup_time;$('branchBox').textContent=o.branch_name;let map={new:['Awaiting branch acceptance','Your order reached the branch. The team will accept or reject it shortly.'],preparing:['Preparing your order','The branch accepted your order and the team is preparing it now.'],ready:['Ready for pickup','Your order is ready. Please collect it from the selected branch.'],completed:['Collected','Order completed. Enjoy.'],cancelled:['Order rejected','The branch could not accept this order.']};let pair=map[o.status]||[o.status,'Your order status was updated.'];$('status').textContent=pair[0];$('details').textContent=pair[1];paintSteps(o.status);$('card').classList.toggle('cancelled',o.status==='cancelled');$('items').innerHTML=(o.items||[]).map(i=>`<div class="item"><div><b>${i.qty} × ${i.product_name}</b><br><small class="muted">${[i.size,i.milk].filter(x=>x&&x!=='N/A').join(' · ')}</small></div><span class="station ${i.station_status==='done'?'ok':''}">${i.station_status==='done'?'Ready':i.station_status}</span></div>`).join('')||'<div class="muted">No item details available.</div>'}
load();try{let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=()=>load();ws.onopen=()=>ws.send('tracking connected')}catch(e){}setInterval(load,30000);
</script></body></html>
