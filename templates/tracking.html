<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><div class="topbar-in"><div class="brand">SALEH.<small>Order Tracking</small></div><a class="btn" href="/">Back to menu</a></div></header><main class="wrap" style="max-width:760px;padding-top:34px"><div class="card"><div class="kicker">Live order status</div><h1 id="no" style="font-size:40px;margin:8px 0"></h1><p id="branch" class="muted"></p><div class="trackbar" style="margin:22px 0"><i id="progress" style="width:10%"></i></div><h2 id="status"></h2><p id="details" class="muted"></p><div id="items"></div></div></main><script>const ORDER={{ order_no|tojson }};const $=id=>document.getElementById(id);async function load(){let r=await fetch('/api/order/'+ORDER);if(!r.ok)return;$('no').textContent='#'+ORDER;let o=await r.json();$('branch').textContent=o.branch_name+' · '+o.pickup_type+' · '+o.pickup_time;let map={new:['Confirmed',20],preparing:['Preparing',55],ready:['Ready for pickup',90],completed:['Collected',100],cancelled:['Cancelled',100]};let [label,p]=map[o.status]||[o.status,20];$('status').textContent=label;$('progress').style.width=p+'%';$('details').textContent=o.status==='ready'?'Your order is ready. Please collect it from the selected branch.':o.status==='preparing'?'The team is preparing your order now.':o.status==='completed'?'Order completed.':'Your order has been received.';$('items').innerHTML=o.items.map(i=>`<div class="cart-item"><div>${i.qty} × <b>${i.product_name}</b></div><span class="pill ${i.station_status==='done'?'ok':''}">${i.station==='bar'?'Bar':'Kitchen'} · ${i.station_status}</span></div>`).join('')}load();let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=load;ws.onopen=()=>ws.send('tracking connected');</script></body></html>
