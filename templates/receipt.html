<!doctype html><html><head><meta charset="utf-8"><title>{{ order.order_no }}</title><style>body{font-family:monospace;width:300px;margin:0 auto;padding:10px;color:#000}.center{text-align:center}.line{border-top:1px dashed #000;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px}.big{font-size:22px;font-weight:bold}@media print{button{display:none}}</style></head><body><div class="center"><div class="big">SALEH.</div><div>{{ order.branch_name }}</div><div class="line"></div><div class="big">#{{ order.order_no }}</div><div>{{ order.pickup_time }}</div></div><div class="line"></div>{% for i in order.items %}<div><b>{{ i.qty }} × {{ i.product_name }}</b><br>{{ i.size }} · {{ i.milk }}</div><br>{% endfor %}<div class="line"></div><div class="row"><b>TOTAL</b><b>{{ '%.2f'|format(order.total) }} AED</b></div><div class="line"></div><div>Customer: {{ order.customer_name }}</div><div>{{ order.mobile }}</div><div class="center" style="margin-top:15px">Thank you.</div><button onclick="print()">Print</button></body></html>
