<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saleh Login</title><link rel="stylesheet" href="/static/style.css">
<style>
.authpage{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f3e5 url('/static/background.png') center/cover no-repeat fixed}
.authcard{width:min(440px,100%);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 70px #0002}
.authbrand{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}.authcard h1{margin:18px 0 6px}.authcard .primary{margin-top:8px}
.autherror{display:none;background:#ffe8e5;color:#8e2f29;padding:11px 13px;border-radius:12px;margin:10px 0}
</style></head>
<body><div class="authpage"><div class="authcard">
<div class="authbrand">SALEH.</div><span class="muted">Operations access</span>
<h1>Sign in</h1><p class="muted">Management and branch staff only.</p>
<div id="err" class="autherror"></div>
<div class="field"><label>Username</label><input id="username" autocomplete="username" autofocus></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="primary" onclick="login()">Sign in</button>
</div></div>
<script>
const NEXT={{ next|tojson }};
async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value,next:NEXT})});let d=await r.json();if(!r.ok){err.style.display='block';err.textContent=d.detail||'Login failed';return}location.href=d.redirect}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
