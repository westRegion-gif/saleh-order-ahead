name: Build Saleh Customer Test APK

on:
  push:
    paths:
      - 'android-customer-test/**'
      - '.github/workflows/build-saleh-customer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build debug APK
        working-directory: android-customer-test
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android-customer-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Customer-Test-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-Customer-Test-v1
          path: dist/Saleh-Customer-Test-v1.apk
