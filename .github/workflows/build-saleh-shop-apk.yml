name: Build Saleh Shop Test APK

on:
  push:
    paths:
      - 'android-shop-test/**'
      - '.github/workflows/build-saleh-shop-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build debug APK
        working-directory: android-shop-test
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp android-shop-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Shop-Test-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-Shop-Test-v1
          path: dist/Saleh-Shop-Test-v1.apk

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Saleh-Shop-Test-v1.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Saleh Shop test APK [skip ci]'
            git push
          fi
