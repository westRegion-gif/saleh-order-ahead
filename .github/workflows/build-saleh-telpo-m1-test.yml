name: Build Saleh Telpo M1 Test APK

on:
  push:
    paths:
      - 'android-telpo-m1-test/**'
      - '.github/workflows/build-saleh-telpo-m1-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare official Telpo SDK v2.28
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-telpo-m1-test/app/libs
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/wiratsil/tapgo_terminal_plugin/main/android/libs/demoSDK_v2.28.20241212.aar' \
            -o android-telpo-m1-test/app/libs/demoSDK_v2.28.20241212.aar
          test -s android-telpo-m1-test/app/libs/demoSDK_v2.28.20241212.aar

      - name: Build APK and capture log
        id: gradle_build
        shell: bash
        working-directory: android-telpo-m1-test
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../telpo-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic log
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp telpo-build.log dist/telpo-build-v1.5.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/telpo-build-v1.5.log
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Telpo v1.5 build log [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Stop on build failure
        if: steps.gradle_build.outputs.status != '0'
        run: |
          echo "Gradle build failed with status ${{ steps.gradle_build.outputs.status }}"
          exit 1

      - name: Prepare artifact
        if: steps.gradle_build.outputs.status == '0'
        run: |
          mkdir -p dist
          cp android-telpo-m1-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Telpo-M1-v1.5.apk

      - uses: actions/upload-artifact@v4
        if: steps.gradle_build.outputs.status == '0'
        with:
          name: Saleh-Telpo-M1-v1.5
          path: dist/Saleh-Telpo-M1-v1.5.apk

      - name: Publish APK to repository
        if: steps.gradle_build.outputs.status == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Saleh-Telpo-M1-v1.5.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Saleh Telpo M1 v1.5 APK [skip ci]'
            git pull --rebase origin main
            git push
          fi
