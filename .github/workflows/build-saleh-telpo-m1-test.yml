name: Build Saleh Telpo M1 Test APK

on:
  push:
    paths:
      - 'android-telpo-m1-test/**'
      - '.github/workflows/build-saleh-telpo-m1-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Download official Telpo SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-telpo-m1-test/app/libs /tmp/telpo
          PAGE='https://service.telpo.com/index/user/getsdk?encode=eyJzbiI6IkE0QlMwMDYwMDAyMDAwMTUiLCJjb3VudHJ5IjoiMTY0In0%3D'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$PAGE" -o /tmp/telpo/page.html
          python3 - <<'PY'
          import re, html, urllib.parse
          text=open('/tmp/telpo/page.html',encoding='utf-8',errors='ignore').read()
          text=html.unescape(text)
          patterns=[
              r'href=["\']([^"\']*DemoSDK20241212_V2\.28\.zip[^"\']*)["\']',
              r'["\']([^"\']*DemoSDK20241212_V2\.28\.zip[^"\']*)["\']',
          ]
          url=None
          for p in patterns:
              m=re.search(p,text,re.I)
              if m:
                  url=m.group(1); break
          if not url:
              raise SystemExit('Could not find Telpo DemoSDK download URL in support page')
          url=urllib.parse.urljoin('https://service.telpo.com/',url)
          open('/tmp/telpo/url.txt','w').write(url)
          print('SDK URL:',url)
          PY
          SDK_URL="$(cat /tmp/telpo/url.txt)"
          curl -fL --retry 3 -A 'Mozilla/5.0' "$SDK_URL" -o /tmp/telpo/sdk.zip
          unzip -j /tmp/telpo/sdk.zip 'aar/demoSDK_v2.28.20241212.aar' -d android-telpo-m1-test/app/libs
          test -s android-telpo-m1-test/app/libs/demoSDK_v2.28.20241212.aar

      - name: Build APK
        working-directory: android-telpo-m1-test
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-telpo-m1-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Telpo-M1-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Saleh-Telpo-M1-v1.2
          path: dist/Saleh-Telpo-M1-v1.2.apk

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Saleh-Telpo-M1-v1.2.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Saleh Telpo M1 v1.2 APK [skip ci]'
            git push
          fi
