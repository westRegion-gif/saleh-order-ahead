name: Build Saleh Telpo M1 Test APK

on:
  push:
    paths:
      - 'android-telpo-m1-test/**'
      - '.github/workflows/build-saleh-telpo-m1-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      # The Telpo support download page is session/dynamic and was breaking CI.
      # Use the public Telpo M1 integration library + native libs used by an M1-tested implementation.
      - name: Prepare Telpo M1 printer library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/telpo-flutter-sdk
          git clone --depth 1 https://github.com/aljanshere/telpo-flutter-sdk.git /tmp/telpo-flutter-sdk
          mkdir -p android-telpo-m1-test/app/libs
          mkdir -p android-telpo-m1-test/app/src/main/jniLibs
          cp /tmp/telpo-flutter-sdk/android/src/libs/telpo_api.jar android-telpo-m1-test/app/libs/telpo_api.jar
          cp -R /tmp/telpo-flutter-sdk/android/src/main/jniLibs/. android-telpo-m1-test/app/src/main/jniLibs/
          test -s android-telpo-m1-test/app/libs/telpo_api.jar

      - name: Build APK
        working-directory: android-telpo-m1-test
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-telpo-m1-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Telpo-M1-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Saleh-Telpo-M1-v1.2
          path: dist/Saleh-Telpo-M1-v1.2.apk

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Saleh-Telpo-M1-v1.2.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Saleh Telpo M1 v1.2 APK [skip ci]'
            git push
          fi
