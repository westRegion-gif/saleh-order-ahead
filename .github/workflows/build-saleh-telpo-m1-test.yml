name: Build Saleh Telpo M1 Test APK

on:
  push:
    paths:
      - 'android-telpo-m1-test/**'
      - '.github/workflows/build-saleh-telpo-m1-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare Telpo printer library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-telpo-m1-test/app/libs
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/aljanshere/telpo-flutter-sdk/master/android/src/libs/telpo_api.jar' \
            -o android-telpo-m1-test/app/libs/telpo_api.jar
          test -s android-telpo-m1-test/app/libs/telpo_api.jar

      - name: Build APK
        working-directory: android-telpo-m1-test
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-telpo-m1-test/app/build/outputs/apk/debug/app-debug.apk dist/Saleh-Telpo-M1-v1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Saleh-Telpo-M1-v1.3
          path: dist/Saleh-Telpo-M1-v1.3.apk

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Saleh-Telpo-M1-v1.3.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Saleh Telpo M1 v1.3 APK [skip ci]'
            git push
          fi
