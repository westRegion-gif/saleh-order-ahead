services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lmtd
      POSTGRES_PASSWORD: lmtd
      POSTGRES_DB: lmtd
    ports:
      - '5432:5432'
    volumes:
      - lmtd_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lmtd -d lmtd']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lmtd_pg:
