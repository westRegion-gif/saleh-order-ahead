plugins {
    id 'com.android.application'
}

android {
    namespace 'ae.lmtd.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'ae.lmtd.pos'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'POS_URL', '"https://eloquent-tranquility-production-11d8.up.railway.app/live-orders"'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation files('libs/telpo_api.jar')
}
